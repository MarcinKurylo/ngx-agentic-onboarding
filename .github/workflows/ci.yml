name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call: # lets the tag-based Release workflow reuse this suite

# Least privilege: every job only reads the repo. Artifact upload uses the
# separate Actions runtime token and is unaffected.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx ng lint

  unit:
    name: Unit & integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The demo spec imports the library from dist/, so build it first.
      - name: Build library
        run: npx ng build ngx-onboarding-flow

      - name: Test library (unit + integration) with coverage thresholds
        run: >-
          npx ng test ngx-onboarding-flow --watch=false --code-coverage
          --browsers=ChromeHeadlessNoSandbox --karma-config karma.conf.js

      - name: Test demo
        run: >-
          npx ng test demo --watch=false
          --browsers=ChromeHeadlessNoSandbox --karma-config karma.conf.js

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Uses the runner's preinstalled Google Chrome via channel: 'chrome'.
      # The Playwright webServer builds the library and serves the demo.
      - name: Run e2e
        run: npx playwright test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
