# Deploys the demo app to GitHub Pages.
#
# LIVE at https://marcinkurylo.github.io/ngx-agentic-onboarding/ — deploys
# automatically on merges to main that touch the demo or the library (see the
# `paths` filter below), and can also be run manually from the Actions tab.
name: Deploy demo to GitHub Pages

on:
  workflow_dispatch:
  # Auto-deploy on merges to main that touch the demo or the library it
  # consumes (skips docs-/skill-/CI-only changes to avoid pointless redeploys).
  push:
    branches: [main]
    paths:
      - 'projects/demo/**'
      - 'projects/ngx-agentic-onboarding/**'
      - '.github/workflows/pages.yml'

# Least-privilege token scoped for Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The demo consumes the library from dist/, so build the library first.
      - name: Build library
        run: npx ng build ngx-agentic-onboarding

      # base-href must match the project-Pages sub-path (the repo name).
      - name: Build demo
        run: npx ng build demo --base-href /ngx-agentic-onboarding/

      # GitHub Pages has no SPA fallback: a deep link like /…/dashboard 404s.
      # Serving a copy of index.html as 404.html lets the Angular router take
      # over and resolve the route client-side.
      - name: SPA fallback + disable Jekyll
        run: |
          cp dist/demo/browser/index.html dist/demo/browser/404.html
          touch dist/demo/browser/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/demo/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
