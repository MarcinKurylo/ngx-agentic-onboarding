name: Release

# Tag-based release. **This publishes to npm for real.**
#
# Pushing a tag like `v0.1.0` runs, in order: verify-tag (the tag must match the
# library's version in package.json), the full CI suite, the Angular 16–22
# compatibility matrix, `npm publish`, and finally the GitHub Release. Any
# failure stops the chain before anything is published.
#
# The release is `latest` on npm — a plain `npm i ngx-onboarding-flow` gets it.
# For a soft launch instead, add `--tag next` to the publish command and promote
# later with `npm dist-tag add ngx-onboarding-flow@<version> latest`.
#
# npm versions are immutable: a published version can never be replaced, and
# even after `npm unpublish` (72h window) that number can't be reused.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Gate 0 — the tag must name the version we are about to publish. Runs first
  # and alone: a mismatch fails in seconds instead of after the whole matrix.
  # Without this, tagging v0.2.0 while package.json still says 0.1.0 publishes
  # 0.1.0 under a v0.2.0 tag, silently and unrepeatably.
  verify-tag:
    name: Tag matches package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare tag with package.json
        run: |
          PKG=$(node -p "require('./projects/ngx-onboarding-flow/package.json').version")
          if [ "v$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the library version ($PKG). Expected tag v$PKG — bump projects/ngx-onboarding-flow/package.json or retag."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches library version $PKG."

  # Gate 1 — the same lint / unit+integration / e2e suite that runs on every PR.
  ci:
    needs: verify-tag
    uses: ./.github/workflows/ci.yml

  # Gate 2 — install + build a consumer app on every supported Angular (16–22).
  compat:
    needs: verify-tag
    uses: ./.github/workflows/compat-matrix.yml

  # Gate 3 — publish. ARMED: reaching this job publishes to npm for real.
  #
  # Nothing here runs unless a `v*` tag is pushed, and only after verify-tag,
  # the full CI suite and the Angular 16–22 matrix have all passed.
  publish:
    name: Publish to npm
    needs: [verify-tag, ci, compat]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for --provenance: npm exchanges this OIDC token for a signed
      # attestation tying the published tarball to this workflow and commit.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Build library
        run: npx ng build ngx-onboarding-flow

      - name: Publish to npm
        run: |
          echo "Tag $GITHUB_REF_NAME passed verify-tag, CI and the Angular 16-22 matrix."
          cd dist/ngx-onboarding-flow
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # The GitHub Release. Deliberately last: a release page must never advertise a
  # version npm rejected, so this waits for the publish to succeed rather than
  # running alongside it.
  #
  # Notes come from CHANGELOG.md, which is the file we already keep by hand — the
  # release is a view of it, not a second thing to write and forget.
  github-release:
    name: GitHub Release
    needs: [verify-tag, ci, compat, publish]
    runs-on: ubuntu-latest
    permissions:
      # The only job that writes to the repo, and only to create the release.
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Take this version's section out of the changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          # Everything between this version's heading and the next one. Matching
          # on the literal "## [x.y.z]" rather than a regex keeps the dots in the
          # version from acting as wildcards, and the closing bracket stops
          # 0.1.1 from matching a future 0.1.10.
          #
          # The oldest entry has no "next heading" to stop at, so the link
          # definitions at the foot of the file would run into it — stop there too.
          NOTES=$(awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && index($0, "## [") == 1 { exit }
            on && /^\[[^]]+\]: / { exit }
            on { print }
          ' CHANGELOG.md | sed '/./,$!d')

          # Relative links work in CHANGELOG.md but not in a release body, where
          # they resolve against the repo root and 404.
          NOTES=$(printf '%s\n' "$NOTES" |
            sed "s|](\./|](https://github.com/$GITHUB_REPOSITORY/blob/main/|g")

          if [ -z "$NOTES" ]; then
            echo "::error::npm publish SUCCEEDED — $VERSION is live. Only the release notes failed: CHANGELOG.md has no '## [$VERSION]' section. Add it, then re-run this job alone."
            exit 1
          fi

          # Written to a file, not to an output: interpolating notes into a shell
          # argument would break on any quote or backtick a changelog can contain.
          {
            printf '%s\n\n' "$NOTES"
            printf '**[%s on npm](https://www.npmjs.com/package/ngx-onboarding-flow/v/%s)** — published from this run with a signed provenance attestation.\n' \
              "ngx-onboarding-flow@$VERSION" "$VERSION"
          } > "$RUNNER_TEMP/notes.md"

      - name: Create the release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
